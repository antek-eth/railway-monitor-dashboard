  * { margin: 0; padding: 0; box-sizing: border-box; }

    color: #b0b0b0;

  .expand-btn {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 11px;
    padding: 0 6px 0 0;
    vertical-align: middle;
    transition: color 0.15s;
    user-select: none;
  }
  .expand-btn:hover { color: #aaa; }
  tr.expanded .expand-btn { color: #ffc107; }

  tr.detail-row.open { display: table-row; }
  tr.detail-row td {
    padding: 0;
    border-bottom: 2px solid #333;
  }
  .detail-inner {
    padding: 12px 24px 16px 32px;
  }

  /* ── Inner timetable ────────────────────────── */
  .detail-table {
    border-collapse: collapse;
    font-size: 12px;
    width: auto;
  }
  .detail-table th {
    font-weight: 500;
    font-size: 11px;
    color: #666;
    padding: 4px 10px;
    border-bottom: 1px solid #2a2d33;
    white-space: nowrap;
    text-align: left;
  }
  .detail-table td {
    padding: 5px 10px;
    border-bottom: 1px solid #1e2026;
    white-space: nowrap;
  }
  .detail-table tr:last-child td { border-bottom: none; }

  /* ── Carrier badges ─────────────────────────── */
  .badge-rj  { color: #ffc107; }
  .badge-leo { color: #ff6600; }
  .badge-ic  { color: #7fb3e0; }
  .badge-eic { color: #4a90d9; }

  /* ── Sandwich separator ─────────────────────── */
  tr.sandwich-sep td {
    padding: 0;
    border-bottom: none;
    height: 6px;
    border-top: 1px dashed #2a2d33;
  }

  /* ── No-data message ────────────────────────── */
  .detail-nodata {
    padding: 10px 0;
    color: #555;
    font-size: 12px;
    font-style: italic;
  }

  .legend {
    margin-top: 20px;
    font-size: 11px;
    color: #666;
    line-height: 1.8;
  }
  .legend span { margin-right: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .dot-rj { background: #ffc107; }
  .dot-leo { background: #ff6600; }
  .dot-eic { background: #4a90d9; }
  .dot-ic { background: #7fb3e0; }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
  }
  .tab {
    padding: 8px 20px;
    background: #22252b;
    color: #888;
    border: 1px solid #333;
    cursor: pointer;
    font-size: 13px;
  }
  .tab:first-child { border-radius: 4px 0 0 4px; }
  .tab:last-child { border-radius: 0 4px 4px 0; }
  .tab.active {
    background: #2a2d33;
    color: #e0e0e0;
    border-color: #555;
  }

  .status-msg {
    padding: 40px 0;
    text-align: center;
    color: #888;
    font-size: 14px;
  }
  .status-msg a {
    color: #4a90d9;
    cursor: pointer;
    text-decoration: underline;
  }
  .footer-meta {
    margin-top: 12px;
    font-size: 11px;
    color: #555;
  }
</style>

    }
    var priceStr = (c.price_min !== null && c.price_min !== undefined)
      ? (c.price_min === c.price_max ? esc(c.price_min) : esc(c.price_min) + " - " + esc(c.price_max))
      : "&mdash;";
    return '<td class="num sep">' + esc(c.trains) + '</td>' +
           '<td class="time">' + esc(c.travel_time || "") + '</td>' +
           '<td class="price">' + priceStr + '</td>';
  }

  function totalsCells4(t) {
    if (!t) {
      return '<td class="na sep">&mdash;</td><td></td><td></td><td class="na">&mdash;</td>';
    }
    var seatsStr = "&mdash;";
    var seatsClass = "na";
    if (t.free_seats !== null && t.free_seats !== undefined) {
      seatsStr = esc(t.free_seats);
      seatsClass = "seats";
    }
    return '<td class="num sep">' + esc(t.trains) + '</td><td></td><td></td>' +
           '<td class="' + seatsClass + '">' + seatsStr + '</td>';
  }

  function totalsCells5(t) {
    if (!t) {
      return '<td class="na sep">&mdash;</td><td></td><td></td><td class="na">&mdash;</td><td class="na">&mdash;</td>';
    }
    var seatsStr = "&mdash;";
    var seatsClass = "na";
    if (t.free_seats !== null && t.free_seats !== undefined) {
      if (t.total_seats !== null && t.total_seats !== undefined) {
        seatsStr = esc(t.free_seats) + " / " + esc(t.total_seats);
      } else {
        seatsStr = esc(t.free_seats);
      }
      seatsClass = "seats";
    }
    var occStr, occCls;
    if (t.occupancy_pct !== null && t.occupancy_pct !== undefined) {
      occStr = esc(t.occupancy_pct) + "%";
      occCls = "occ " + occClass(t.occupancy_pct);
    } else {
      occStr = "&mdash;";
      occCls = "na";
    }
    return '<td class="num sep">' + esc(t.trains) + '</td><td></td><td></td>' +
           '<td class="' + seatsClass + '">' + seatsStr + '</td>' +
           '<td class="' + occCls + '">' + occStr + '</td>';
  }

  function totalsCells3(t) {
    if (!t) {
      return '<td class="na sep">&mdash;</td><td></td><td></td>';
    }
    return '<td class="num sep">' + esc(t.trains) + '</td><td></td><td></td>';
  }

  function renderTable(data) {
    var routes = data.routes || [];
    var totals = data.totals || {};

    var html = '<table><thead><tr>' +
      '<th rowspan="2" style="vertical-align:bottom;">Trasa</th>' +
      '<th colspan="5" class="carrier-group carrier-rj sep">REGIOJET</th>' +
      '<th colspan="5" class="carrier-group carrier-leo sep">LEO EXPRESS</th>' +
      '<th colspan="3" class="carrier-group carrier-eic sep">EIC / EIP</th>' +
      '<th colspan="3" class="carrier-group carrier-ic sep">IC</th>' +
      '</tr><tr class="sub-header">' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th><th>Wolne</th><th>Zajete</th>' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th><th>Wolne</th><th>Zajete</th>' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th>' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th>' +
      '</tr></thead><tbody>';

    for (var i = 0; i < routes.length; i++) {
      var r = routes[i];
      var carriers = r.carriers || {};
      var routeClass = r.international ? "route route-intl" : "route";
      var rowId = 'rdet-' + i + '_' + r.name.replace(/[^a-zA-Z0-9]/g, '_');
      html += '<tr class="route-summary-row" data-route-id="' + esc(rowId) + '">' +
              '<td class="' + routeClass + '">' +
              '<button class="expand-btn" data-target="' + esc(rowId) + '" aria-label="Rozwin trasę">&#9658;</button>' +
              esc(r.name_pl || r.name) +
              '</td>';
      html += carrierCells5(carriers.RJ);
      html += carrierCells5(carriers.LEO);
      html += carrierCells3(carriers.EIC);
      html += carrierCells3(carriers.IC);
      html += '</tr>';
      html += '<tr class="detail-row" id="' + esc(rowId) + '" data-route-name="' + esc(r.name) + '">' +
              '<td colspan="17">' +
              '<div class="detail-inner" id="' + esc(rowId) + '-content">' +
              '<div class="detail-nodata">Ładowanie rozkładu...</div>' +
              '</div></td></tr>';
    }

    // Totals row
    html += '<tr class="totals"><td>Razem</td>';
    html += totalsCells5(totals.RJ);
    html += totalsCells5(totals.LEO);
    html += totalsCells3(totals.EIC);
    html += totalsCells3(totals.IC);
    html += '</tr>';

    html += '</tbody></table>';
    return html;
  }

  function renderDetailPanel(containerEl, routeName) {
    var baked = window.__BAKED || {};
    var currentDate = tabs[activeTab].date;
    var timetablesByRoute = (baked[currentDate] || {}).timetables || {};
    var rows = timetablesByRoute[routeName] || [];

    if (rows.length === 0) {
      containerEl.innerHTML = '<div class="detail-nodata">Brak danych szczegółowych dla tej trasy.</div>';
      return;
    }

    // Group rows by departure time
    var byDep = {};
    rows.forEach(function(r) {
      if (!byDep[r.dep]) byDep[r.dep] = [];
      byDep[r.dep].push(r);
    });

    // Identify competitor departure times and IC departure times
    var compDeps = [];
    var icByDep = {};

    Object.keys(byDep).sort().forEach(function(dep) {
      var hasComp = byDep[dep].some(function(r) { return r.carrier !== 'IC'; });
      var hasIC   = byDep[dep].some(function(r) { return r.carrier === 'IC'; });
      if (hasComp) compDeps.push(dep);
      if (hasIC) {
        icByDep[dep] = byDep[dep].find(function(r) { return r.carrier === 'IC'; });
      }
    });

    var icDeps = Object.keys(icByDep).sort();

    if (compDeps.length === 0) {
      containerEl.innerHTML = '<div class="detail-nodata">Brak danych szczegółowych dla tej trasy.</div>';
      return;
    }

    // For each competitor dep find sandwich IC times
    var sandwichIC = {};
    compDeps.forEach(function(cdep) {
      var before = icDeps.filter(function(d) { return d < cdep; });
      var after  = icDeps.filter(function(d) { return d > cdep; });
      if (before.length) sandwichIC[before[before.length - 1]] = true;
      if (after.length)  sandwichIC[after[0]] = true;
    });

    // Build sorted list of dep times to render
    var allDepsToShow = {};
    compDeps.forEach(function(d) { allDepsToShow[d] = 'comp'; });
    Object.keys(sandwichIC).forEach(function(d) {
      if (!allDepsToShow[d]) allDepsToShow[d] = 'ic';
    });
    var sortedDeps = Object.keys(allDepsToShow).sort();

    // Render
    var html = '<table class="detail-table"><thead><tr>' +
      '<th>Odj.</th><th>Przyj.</th><th>Przewoźnik</th><th>Klasa</th><th>Cena</th><th>Wolne</th>' +
      '</tr></thead><tbody>';

    var prevWasIC = false;

    for (var i = 0; i < sortedDeps.length; i++) {
      var dep = sortedDeps[i];
      var kind = allDepsToShow[dep];

      // Draw dashed separator before a comp block that follows IC (new sandwich group)
      if (kind === 'comp' && prevWasIC) {
        html += '<tr class="sandwich-sep"><td colspan="6"></td></tr>';
      }
      // Draw dashed separator before an IC that follows a comp block (end of group)
      if (kind === 'ic' && !prevWasIC && i > 0) {
        html += '<tr class="sandwich-sep"><td colspan="6"></td></tr>';
      }

      if (kind === 'comp') {
        var compRows = byDep[dep].filter(function(r) { return r.carrier !== 'IC'; });
        compRows.forEach(function(r) {
          html += buildDetailRow(r);
        });
        prevWasIC = false;
      } else {
        var icRow = icByDep[dep];
        if (icRow) html += buildDetailRow(icRow);
        prevWasIC = true;
      }
    }

    html += '</tbody></table>';
    containerEl.innerHTML = html;
  }

  function buildDetailRow(r) {
    var badgeCls, label;
    if (r.carrier === 'RJ') {
      badgeCls = 'badge-rj';
      label = '&#9632; RegioJet';
    } else if (r.carrier === 'LEO') {
      badgeCls = 'badge-leo';
      label = '&#9632; Leo Express';
    } else if (r.brand === 'EIC' || r.brand === 'EIP') {
      badgeCls = 'badge-eic';
      label = '&#9675; IC (' + esc(r.brand) + ')';
    } else {
      badgeCls = 'badge-ic';
      label = '&#9675; IC';
    }

    var priceStr = (r.price !== null && r.price !== undefined)
      ? Math.round(r.price) + '&nbsp;z\u0142' : '&mdash;';
    var seatsStr = (r.seats !== null && r.seats !== undefined)
      ? esc(r.seats) : '&mdash;';
    var arrStr = r.arr ? esc(r.arr) : '&mdash;';

    return '<tr>' +
      '<td>' + esc(r.dep) + '</td>' +
      '<td style="color:#666">' + arrStr + '</td>' +
      '<td class="' + badgeCls + '">' + label + '</td>' +
      '<td style="color:#999;font-size:11px">' + esc(r.cls) + '</td>' +
      '<td style="text-align:right">' + priceStr + '</td>' +
      '<td style="text-align:right;color:#888">' + seatsStr + '</td>' +
      '</tr>';
  }

  function attachExpandHandlers() {
    var btns = document.querySelectorAll('.expand-btn');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var targetId = btn.getAttribute('data-target');
        var detailRow = document.getElementById(targetId);
        var summaryRow = btn.closest('tr');
        if (!detailRow) return;

        var isOpen = detailRow.classList.contains('open');
        if (isOpen) {
          detailRow.classList.remove('open');
          summaryRow.classList.remove('expanded');
          btn.textContent = '\u25B6';
          btn.setAttribute('aria-expanded', 'false');
        } else {
          detailRow.classList.add('open');
          summaryRow.classList.add('expanded');
          btn.textContent = '\u25BC';
          btn.setAttribute('aria-expanded', 'true');
          var contentDiv = document.getElementById(targetId + '-content');
          if (contentDiv && !contentDiv.dataset.loaded) {
            contentDiv.dataset.loaded = '1';
            var routeName = detailRow.getAttribute('data-route-name');
            renderDetailPanel(contentDiv, routeName);
          }
        }
      });
    });
  }

  function fetchData(date) {
    var contentEl = document.getElementById("content");
    var legendEl = document.getElementById("legend");
    var footerEl = document.getElementById("footer-meta");
    var sampleEl = document.getElementById("sample-date");

    contentEl.innerHTML = '<div class="status-msg">Ladowanie danych...</div>';
    legendEl.style.display = "none";
    footerEl.textContent = "";
    sampleEl.textContent = "";

    var url = "/api/overview?date=" + encodeURIComponent(date);
    fetch(url)
      .then(function(resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function(json) {
        var data = json.data;
        var meta = json.meta || {};

        contentEl.innerHTML = '<div class="month-section">' + renderTable(data) + '</div>';
        attachExpandHandlers();
        legendEl.style.display = "block";

        sampleEl.textContent = "Probka: " + (meta.date || date);

        if (meta.fetch_time_ms !== null && meta.fetch_time_ms !== undefined) {
          footerEl.textContent = "Czas odpowiedzi: " + meta.fetch_time_ms + "ms";
        }
      })
      .catch(function(err) {
        contentEl.innerHTML = '<div class="status-msg">Blad polaczenia z API. <a id="retry-link">Sprobuj ponownie.</a></div>';
        document.getElementById("retry-link").addEventListener("click", function() {
          fetchData(date);
        });
      });
  }

  // Init
  renderTabs();
  fetchData(tabs[0].date);
})();
</script>
</body>
</html>
