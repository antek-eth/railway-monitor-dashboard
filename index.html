  .carrier-rj { color: #ffc107; border-bottom-color: #ffc107 !important; }
  .carrier-leo { color: #ff6600; border-bottom-color: #ff6600 !important; }
  .carrier-eic { color: #4a90d9; border-bottom-color: #4a90d9 !important; }
  .carrier-ic { color: #7fb3e0; border-bottom-color: #7fb3e0 !important; }

  .sub-header th {
    font-weight: 400;
    font-size: 11px;
    color: #888;
    padding: 4px 12px;
    border-bottom: 1px solid #2a2d33;
    position: sticky;
    top: 30px;
    z-index: 2;

  }

  .route { color: #e0e0e0; font-weight: 500; }
  .route-intl { color: #aaa; font-style: italic; }

  /* Carrier group separator (thick) */
  .sep { border-left: 2px solid #444; }
  /* Inner column separators (thin dotted) */
  tbody td:not(:first-child):not(.sep),
  .sub-header th:not(:first-child):not(.sep) {
    border-left: 1px dotted #2a2d33;
  }

  .num { text-align: right; }
  .time { text-align: right; color: #aaa; font-size: 12px; }
  .price { text-align: right; color: #c8c8c8; }
  .seats { text-align: right; color: #aaa; }
  .occ { text-align: right; }
  .occ-high { color: #ff6b6b; }
  .occ-med { color: #ffc107; }
  .occ-low { color: #66bb6a; }
  .na { color: #555; text-align: center; }

  .totals td {
    border-top: 2px solid #333;
    font-weight: 600;
    color: #b0b0b0;
    padding-top: 8px;
  }

  /* ── Expand/collapse toggle ──────────────────── */
  .expand-btn {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 11px;
    padding: 0 6px 0 0;
    vertical-align: middle;
    transition: color 0.15s;
    user-select: none;
  }
  .expand-btn:hover { color: #aaa; }
  tr.expanded .expand-btn { color: #ffc107; }

  /* ── Detail train rows (chronological, full-width) ── */
  tr.detail-train {
    background: #16181d;
  }
  tr.detail-train td {
    padding: 4px 12px;
    border-bottom: 1px solid #1e2026;
    font-size: 12px;
    white-space: nowrap;
  }
  tr.detail-train:hover { background: #1e2126; }
  tr.detail-train td:first-child {
    padding-left: 28px;
    font-weight: 500;
  }

  /* ── Carrier-colored departure times ─────────── */
  .c-rj  { color: #ffc107; font-weight: 600; }
  .c-leo { color: #ff6600; font-weight: 600; }
  .c-eic { color: #4a90d9; font-weight: 600; }
  .c-ic  { color: #7fb3e0; font-weight: 600; }

  .legend {
    margin-top: 20px;
    font-size: 11px;
    color: #666;
    line-height: 1.8;
  }
  .legend span { margin-right: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .dot-rj { background: #ffc107; }
  .dot-leo { background: #ff6600; }
  .dot-eic { background: #4a90d9; }
  .dot-ic { background: #7fb3e0; }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
  }
  .tab {
    padding: 8px 20px;
    background: #22252b;
    color: #888;
    border: 1px solid #333;
    cursor: pointer;
    font-size: 13px;
  }
  .tab:first-child { border-radius: 4px 0 0 4px; }
  .tab:last-child { border-radius: 0 4px 4px 0; }
  .tab.active {
    background: #2a2d33;
    color: #e0e0e0;
    border-color: #555;
  }

  .status-msg {
    padding: 40px 0;
    text-align: center;
    color: #888;
    font-size: 14px;
  }
  .status-msg a {
    color: #4a90d9;
    cursor: pointer;
    text-decoration: underline;
  }
  .footer-meta {
    margin-top: 12px;
    font-size: 11px;
    color: #555;
  }
</style>

<script>
(function() {
  var MONTHS_PL = ["Styczen", "Luty", "Marzec", "Kwiecien", "Maj", "Czerwiec",
                   "Lipiec", "Sierpien", "Wrzesien", "Pazdziernik", "Listopad", "Grudzien"];

  var today = new Date();
  var curYear = today.getFullYear();
  var curMonth = today.getMonth(); // 0-indexed

  var nextMonth = (curMonth + 1) % 12;
  var nextYear = curMonth === 11 ? curYear + 1 : curYear;

  // Representative dates
  function getRepDate(monthIdx, year) {
    if (monthIdx === curMonth && year === curYear) {
      var tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (tomorrow.getMonth() !== curMonth) {
        return formatDate(today);
      }
      return formatDate(tomorrow);
    }
    return year + "-" + pad(monthIdx + 1) + "-15";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function formatDate(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  var tabs = (window.__BAKED_TABS || []).map(function(t) {
    var parts = t.date.split("-");
    return { label: t.label, date: t.date, month: parseInt(parts[1],10)-1, year: parseInt(parts[0],10) };
  });

  var activeTab = 0;

  function renderTabs() {
    var container = document.getElementById("tabs");
    container.innerHTML = "";
    for (var i = 0; i < tabs.length; i++) {
      var div = document.createElement("div");
      div.className = "tab" + (i === activeTab ? " active" : "");
      div.textContent = tabs[i].label;
      div.setAttribute("data-idx", i);
      div.addEventListener("click", function() {
        var idx = parseInt(this.getAttribute("data-idx"));
        if (idx === activeTab) return;
        activeTab = idx;
        renderTabs();
        fetchData(tabs[idx].date);
      });
      container.appendChild(div);
    }
    var tab = tabs[activeTab];
    document.getElementById("subtitle").innerHTML =
      "Dane z API przewoznikow &bull; " + MONTHS_PL[tab.month] + " " + tab.year;
  }

  function occClass(pct) {
    if (pct === null || pct === undefined) return "";
    if (pct < 40) return "occ-low";
    if (pct <= 60) return "occ-med";
    return "occ-high";
  }

  function esc(s) {
    if (s === null || s === undefined) return "";
    var d = document.createElement("div");
    d.textContent = String(s);
    return d.innerHTML;
  }

  function carrierCells5(c) {
    if (!c) {
      return '<td class="na sep">&mdash;</td><td class="na">&mdash;</td><td class="na">&mdash;</td><td class="na">&mdash;</td><td class="na">&mdash;</td>';
    }
    var priceStr = (c.price_min !== null && c.price_min !== undefined)
      ? (c.price_min === c.price_max ? esc(c.price_min) : esc(c.price_min) + " - " + esc(c.price_max))
      : "&mdash;";
    var seatsStr = (c.free_seats !== null && c.free_seats !== undefined) ? esc(c.free_seats) : "&mdash;";
    var seatsClass = (c.free_seats !== null && c.free_seats !== undefined) ? "seats" : "na";
    var occStr, occCls;
    if (c.occupancy_pct !== null && c.occupancy_pct !== undefined) {
      occStr = esc(c.occupancy_pct) + "%";
      occCls = "occ " + occClass(c.occupancy_pct);
    } else {
      occStr = "&mdash;";
      occCls = "na";
    }
    return '<td class="num sep">' + esc(c.trains) + '</td>' +
           '<td class="time">' + esc(c.travel_time || "") + '</td>' +
           '<td class="price">' + priceStr + '</td>' +
           '<td class="' + seatsClass + '">' + seatsStr + '</td>' +
           '<td class="' + occCls + '">' + occStr + '</td>';
  }

  function totalsCells5(t) {
    if (!t) {
      return '<td class="na sep">&mdash;</td><td></td><td></td><td class="na">&mdash;</td><td class="na">&mdash;</td>';
    }
    var seatsStr = "&mdash;";
    var seatsClass = "na";
    if (t.free_seats !== null && t.free_seats !== undefined) {
      if (t.total_seats !== null && t.total_seats !== undefined) {
        seatsStr = esc(t.free_seats) + " / " + esc(t.total_seats);
      } else {
        seatsStr = esc(t.free_seats);
      }
      seatsClass = "seats";
    }
    var occStr, occCls;
    if (t.occupancy_pct !== null && t.occupancy_pct !== undefined) {
      occStr = esc(t.occupancy_pct) + "%";
      occCls = "occ " + occClass(t.occupancy_pct);
    } else {
      occStr = "&mdash;";
      occCls = "na";
    }
    return '<td class="num sep">' + esc(t.trains) + '</td><td></td><td></td>' +
           '<td class="' + seatsClass + '">' + seatsStr + '</td>' +
           '<td class="' + occCls + '">' + occStr + '</td>';
  }

  function renderTable(data) {
    var routes = data.routes || [];
    var totals = data.totals || {};

    var html = '<table><thead><tr>' +
      '<th rowspan="2" style="vertical-align:bottom;">Trasa</th>' +
      '<th colspan="5" class="carrier-group carrier-rj sep">REGIOJET</th>' +
      '<th colspan="5" class="carrier-group carrier-leo sep">LEO EXPRESS</th>' +
      '<th colspan="5" class="carrier-group carrier-eic sep">EIC / EIP</th>' +
      '<th colspan="5" class="carrier-group carrier-ic sep">IC</th>' +
      '</tr><tr class="sub-header">' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th><th>Wolne</th><th>Zajete</th>' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th><th>Wolne</th><th>Zajete</th>' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th><th>Wolne</th><th>Zajete</th>' +
      '<th class="sep">Poc.</th><th>Czas</th><th>Cena (zl)</th><th>Wolne</th><th>Zajete</th>' +
      '</tr></thead><tbody>';

    for (var i = 0; i < routes.length; i++) {
      var r = routes[i];
      var carriers = r.carriers || {};
      var routeClass = r.international ? "route route-intl" : "route";
      var rowId = 'rdet-' + i + '_' + r.name.replace(/[^a-zA-Z0-9]/g, '_');
      html += '<tr class="route-summary-row" data-route-id="' + esc(rowId) + '" data-route-name="' + esc(r.name) + '">' +
              '<td class="' + routeClass + '">' +
              '<button class="expand-btn" data-target="' + esc(rowId) + '" aria-label="Rozwin trasę">&#9658;</button>' +
              esc(r.name_pl || r.name) +
              '</td>';
      html += carrierCells5(carriers.RJ);
      html += carrierCells5(carriers.LEO);
      html += carrierCells5(carriers.EIC);
      html += carrierCells5(carriers.IC);
      html += '</tr>';
    }

    // Totals row
    html += '<tr class="totals"><td>Razem</td>';
    html += totalsCells5(totals.RJ);
    html += totalsCells5(totals.LEO);
    html += totalsCells5(totals.EIC);
    html += totalsCells5(totals.IC);
    html += '</tr>';

    html += '</tbody></table>';
    return html;
  }

  function buildDetailRows(routeName, parentId) {
    var baked = window.__BAKED || {};
    var currentDate = tabs[activeTab].date;
    var timetablesByRoute = (baked[currentDate] || {}).timetables || {};
    var rows = timetablesByRoute[routeName] || [];

    if (rows.length === 0) return '';

    // Aggregate: group by dep + carrier → one entry per train
    var trainMap = {};
    rows.forEach(function(r) {
      var key = r.dep + '|' + r.carrier;
      if (!trainMap[key]) {
        trainMap[key] = {
          dep: r.dep, arr: r.arr, carrier: r.carrier, brand: r.brand,
          price_min: null, price_max: null, free_seats: 0, cap: 0,
          has_seats: false, has_cap: false
        };
      }
      var t = trainMap[key];
      if (r.price !== null && r.price !== undefined) {
        var p = Math.round(r.price);
        if (t.price_min === null || p < t.price_min) t.price_min = p;
        if (t.price_max === null || p > t.price_max) t.price_max = p;
      }
      if (r.seats !== null && r.seats !== undefined) {
        t.free_seats += r.seats;
        t.has_seats = true;
      }
      if (r.cap !== null && r.cap !== undefined) {
        t.cap += r.cap;
        t.has_cap = true;
      }
      if (r.brand && (r.brand === 'EIC' || r.brand === 'EIP')) t.brand = r.brand;
    });

    var trains = Object.keys(trainMap).map(function(k) { return trainMap[k]; });
    trains.sort(function(a, b) { return a.dep < b.dep ? -1 : a.dep > b.dep ? 1 : 0; });

    // Compute occupancy
    trains.forEach(function(t) {
      if (t.has_seats && t.has_cap && t.cap > 0) {
        t.occ = Math.max(0, Math.round((1 - t.free_seats / t.cap) * 100));
      } else {
        t.occ = null;
      }
    });

    // Sandwich IC filter
    var compDeps = [];
    var icByDep = {};
    trains.forEach(function(t) {
      if (t.carrier !== 'IC') {
        compDeps.push(t.dep);
      } else {
        icByDep[t.dep] = t;
      }
    });
    var icDeps = Object.keys(icByDep).sort();

    var sandwichIC = {};
    compDeps.forEach(function(cdep) {
      var before = icDeps.filter(function(d) { return d < cdep; });
      var after  = icDeps.filter(function(d) { return d > cdep; });
      if (before.length) sandwichIC[before[before.length - 1]] = true;
      if (after.length)  sandwichIC[after[0]] = true;
    });

    // Collect all trains to show (chronological order)
    var filtered = [];
    trains.forEach(function(t) {
      if (t.carrier !== 'IC') {
        filtered.push(t);
      } else if (sandwichIC[t.dep]) {
        filtered.push(t);
      }
    });
    filtered.sort(function(a, b) { return a.dep < b.dep ? -1 : a.dep > b.dep ? 1 : 0; });

    if (filtered.length === 0) return '';

    // Build rows — one per train, chronological order
    var html = '';
    filtered.forEach(function(t) {
      html += '<tr class="detail-train" data-parent="' + esc(parentId) + '">';

      // Column 1: carrier dot + departure time
      var carrierKey = t.carrier === 'IC'
        ? (t.brand === 'EIC' || t.brand === 'EIP' ? 'eic' : 'ic')
        : t.carrier.toLowerCase();
      html += '<td><span class="dot dot-' + carrierKey + '"></span> <span class="c-' + carrierKey + '">' + esc(t.dep) + '</span></td>';

      // Fill carrier-specific columns, empty for others
      if (t.carrier === 'RJ') {
        html += detailCells5_data(t);
        html += emptyCells5();
        html += emptyCells5();
        html += emptyCells5();
      } else if (t.carrier === 'LEO') {
        html += emptyCells5();
        html += detailCells5_data(t);
        html += emptyCells5();
        html += emptyCells5();
      } else if (t.carrier === 'IC' && (t.brand === 'EIC' || t.brand === 'EIP')) {
        html += emptyCells5();
        html += emptyCells5();
        html += detailCells5_data(t);
        html += emptyCells5();
      } else {
        html += emptyCells5();
        html += emptyCells5();
        html += emptyCells5();
        html += detailCells5_data(t);
      }

      html += '</tr>';
    });
    return html;
  }

  function detailCells5_data(t) {
    var priceStr = '';
    if (t.price_min !== null) {
      priceStr = (t.price_min === t.price_max)
        ? esc(t.price_min) + ' z\u0142'
        : 'od ' + esc(t.price_min) + ' z\u0142';
    }
    var seatsStr = t.has_seats ? esc(t.free_seats) : '';
    var seatsClass = t.has_seats ? 'seats' : '';
    var occStr = '', occCls = '';
    if (t.occ !== null) {
      occStr = esc(t.occ) + '%';
      occCls = 'occ ' + occClass(t.occ);
    }
    return '<td class="sep time">' + esc(t.arr || '') + '</td>' +
           '<td></td>' +
           '<td class="price">' + priceStr + '</td>' +
           '<td class="' + seatsClass + '">' + seatsStr + '</td>' +
           '<td class="' + occCls + '">' + occStr + '</td>';
  }

  function emptyCells5() {
    return '<td class="sep"></td><td></td><td></td><td></td><td></td>';
  }

  function attachExpandHandlers() {
    var btns = document.querySelectorAll('.expand-btn');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var targetId = btn.getAttribute('data-target');
        var summaryRow = btn.closest('tr');
        if (!summaryRow) return;

        var isOpen = summaryRow.classList.contains('expanded');
        if (isOpen) {
          summaryRow.classList.remove('expanded');
          btn.textContent = '\u25B6';
          btn.setAttribute('aria-expanded', 'false');
          var details = document.querySelectorAll('tr[data-parent="' + targetId + '"]');
          details.forEach(function(tr) { tr.remove(); });
        } else {
          summaryRow.classList.add('expanded');
          btn.textContent = '\u25BC';
          btn.setAttribute('aria-expanded', 'true');
          var routeName = summaryRow.getAttribute('data-route-name');
          var detailHtml = buildDetailRows(routeName, targetId);
          if (detailHtml) {
            summaryRow.insertAdjacentHTML('afterend', detailHtml);
          }
        }
      });
    });
  }

  function fetchData(date) {
    var contentEl = document.getElementById("content");
    var legendEl = document.getElementById("legend");
    var footerEl = document.getElementById("footer-meta");
    var sampleEl = document.getElementById("sample-date");

    contentEl.innerHTML = '<div class="status-msg">Ladowanie danych...</div>';
    legendEl.style.display = "none";
    footerEl.textContent = "";
    sampleEl.textContent = "";

    var url = "/api/overview?date=" + encodeURIComponent(date);
    fetch(url)
      .then(function(resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function(json) {
        var data = json.data;
        var meta = json.meta || {};

        contentEl.innerHTML = '<div class="month-section">' + renderTable(data) + '</div>';
        attachExpandHandlers();
        legendEl.style.display = "block";

        sampleEl.textContent = "Probka: " + (meta.date || date);

        if (meta.fetch_time_ms !== null && meta.fetch_time_ms !== undefined) {
          footerEl.textContent = "Czas odpowiedzi: " + meta.fetch_time_ms + "ms";
        }
      })
      .catch(function(err) {
        contentEl.innerHTML = '<div class="status-msg">Blad polaczenia z API. <a id="retry-link">Sprobuj ponownie.</a></div>';
        document.getElementById("retry-link").addEventListener("click", function() {
          fetchData(date);
        });
      });
  }

  // Init
  renderTabs();
  fetchData(tabs[0].date);
})();
</script>
